name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Build standalone desktop app
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --windowed
          --onedir
          --name SoThuChi
          --hidden-import=_tkinter
          gui.py

      - name: Verify required Tkinter extension exists
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "dist/SoThuChi" -Recurse -Filter "_tkinter*.pyd"
          if (-not $found) {
            Write-Error "The packaged app does not contain the _tkinter extension."
            exit 1
          }
          $found | ForEach-Object { Write-Host $_.FullName }

      - name: Prepare ZIP with app and source code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "package/SoThuChi" -Force | Out-Null
          New-Item -ItemType Directory -Path "package/SourceCode" -Force | Out-Null
          Copy-Item -Path "dist/SoThuChi/*" -Destination "package/SoThuChi" -Recurse -Force

          # Include Python source files only; never package personal transaction/budget data.
          Get-ChildItem -Path "." -File -Filter "*.py" |
            Where-Object { $_.Name -notin @("__init__.py") } |
            Copy-Item -Destination "package/SourceCode" -Force

          if (Test-Path "README.md") { Copy-Item "README.md" "package/README.md" -Force }
          if (Test-Path "requirements.txt") { Copy-Item "requirements.txt" "package/SourceCode/requirements.txt" -Force }
          @'
          SO THU CHI - WINDOWS PORTABLE
          
          CHAY UNG DUNG:
          1. Mo thu muc SoThuChi.
          2. Nhan dup SoThuChi.exe.
          3. Giu nguyen cac file va thu muc di kem trong SoThuChi.
          
          XEM MA NGUON:
          - Mo thu muc SourceCode.
          - Mo cac file .py bang VS Code hoac Notepad.
          - De chay ma nguon, may can cai Python va cac thu vien trong requirements.txt (neu co).
          
          LUU Y:
          - Ban EXE da dong goi va ma nguon la hai phan rieng.
          - Khong dua du lieu thu chi ca nhan vao ZIP cong khai.
          '@ | Set-Content -Path "package/README-PORTABLE.txt" -Encoding UTF8

          Compress-Archive -Path "package/*" -DestinationPath "SoThuChi-Windows.zip" -Force

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Windows
          path: SoThuChi-Windows.zip
          if-no-files-found: error
          retention-days: 30
